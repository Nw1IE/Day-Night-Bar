services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: barsite-backend:latest
    container_name: barsite-backend
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      - db

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: barsite-frontend:latest
    container_name: barsite-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: barsite-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  db_data:
